<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d1b4b"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg2)"/>
  <!-- Jersey -->
  <ellipse cx="100" cy="150" rx="65" ry="55" fill="#1565c0"/>
  <rect x="45" y="120" width="110" height="80" rx="4" fill="#1565c0"/>
  <!-- Neck -->
  <ellipse cx="100" cy="108" rx="23" ry="20" fill="#c8874a"/>
  <!-- Head - slightly rounder / wider for Rohit -->
  <ellipse cx="100" cy="78" rx="43" ry="42" fill="#c8874a"/>
  <!-- Hair - short  -->
  <ellipse cx="100" cy="44" rx="43" ry="16" fill="#2a1a0a"/>
  <rect x="57" y="42" width="86" height="14" rx="2" fill="#2a1a0a"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="79" rx="6.5" ry="6" fill="white"/>
  <ellipse cx="116" cy="79" rx="6.5" ry="6" fill="white"/>
  <ellipse cx="85" cy="80" rx="3.5" ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="117" cy="80" rx="3.5" ry="3.5" fill="#1a1a1a"/>
  <!-- Eyebrows -->
  <path d="M76 68 Q84 64 92 68" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M108 68 Q116 64 124 68" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M100 84 Q96 93 101 96 Q105 95 100 84" fill="#b06535"/>
  <!-- Smile -->
  <path d="M86 102 Q100 112 114 102" stroke="#8b4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Stubble hint -->
  <ellipse cx="100" cy="102" rx="18" ry="7" fill="#b06535" opacity="0.3"/>
  <!-- Jersey Number -->
  <text x="100" y="165" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="bold">45</text>
  <text x="100" y="148" text-anchor="middle" fill="#FFD700" font-family="Arial" font-size="10" font-weight="bold">INDIA</text>
  <rect x="20" y="178" width="160" height="18" rx="4" fill="#FFD700"/>
  <text x="100" y="191" text-anchor="middle" fill="#1a237e" font-family="Arial" font-size="10" font-weight="bold">ROHIT SHARMA #45</text>
</svg>