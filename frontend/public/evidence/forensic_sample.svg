<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250" width="100%" height="100%">
  <rect width="350" height="250" fill="#0c0a09"/>
  
  <rect x="15" y="15" width="320" height="220" fill="#1c1917" stroke="#44403c" rx="4"/>
  
  <!-- Hospital & Forensic Header -->
  <text x="30" y="38" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold">GOVERNMENT MEDICAL COLLEGE & FORENSIC LAB</text>
  <text x="30" y="54" fill="#a8a29e" font-family="monospace" font-size="9">UDR INQUEST #KA/MYS/2024/UDR-014 · SEC 194 BNSS</text>
  <line x1="30" y1="62" x2="320" y2="62" stroke="#44403c"/>
  
  <!-- Body Outline silhouette / Markings -->
  <g transform="translate(40, 80) scale(0.6)" stroke="#78716c" stroke-width="2" fill="#292524">
    <!-- Head -->
    <circle cx="60" cy="20" r="15"/>
    <!-- Torso -->
    <path d="M 40 40 L 80 40 L 75 120 L 45 120 Z"/>
    <!-- Arms -->
    <path d="M 40 40 L 15 100 L 25 105 L 45 55"/>
    <path d="M 80 40 L 105 100 L 95 105 L 75 55"/>
    <!-- Legs -->
    <path d="M 45 120 L 35 190 L 48 190 L 58 120"/>
    <path d="M 75 120 L 85 190 L 72 190 L 62 120"/>
  </g>
  
  <!-- Tattoo Identification Callout -->
  <circle cx="50" cy="140" r="8" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <line x1="58" y1="140" x2="130" y2="105" stroke="#f43f5e" stroke-width="1.5"/>
  
  <rect x="130" y="90" width="185" height="50" fill="#292524" stroke="#f43f5e" rx="3"/>
  <text x="138" y="106" fill="#f43f5e" font-family="monospace" font-size="9" font-weight="bold">IDENTIFYING ANTE-MORTEM MARK</text>
  <text x="138" y="122" fill="#f5f5f4" font-family="sans-serif" font-size="9">"Trishul Tattoo" on right wrist</text>
  <text x="138" y="133" fill="#a8a29e" font-family="monospace" font-size="8">Matched with Missing FIR: KA/HSN/089</text>
  
  <!-- Post-mortem summary -->
  <text x="130" y="165" fill="#e7e5e4" font-family="sans-serif" font-size="9">Est. Age: 28-32 Yrs · Gender: Male</text>
  <text x="130" y="180" fill="#e7e5e4" font-family="sans-serif" font-size="9">Clothing: Dark blue jeans, Black T-shirt</text>
  <text x="130" y="195" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">STATUS: Cross-jurisdiction match found</text>
</svg>
